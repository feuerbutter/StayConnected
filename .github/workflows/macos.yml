name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core checks
        run: swift run StayConnectedCoreChecks
      - name: Release app bundle
        run: ./scripts/build-app.sh
      - name: Shell syntax
        run: zsh -n scripts/build-app.sh scripts/install.sh scripts/uninstall.sh
